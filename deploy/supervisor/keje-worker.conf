# Always-on media queue worker for Keje — Supervisor variant.
#
# Equivalent to deploy/systemd/keje-worker.service. Use whichever your host
# already runs; installing both means two workers competing for the same jobs.
# systemd needs no extra package on a modern Ubuntu VPS, so prefer it unless
# Supervisor is already managing other processes here.
#
# The same three settings matter for the same reasons — see the comments in
# the systemd unit:
#
#   user=www-data     decides who owns every rendered MP4
#   umask=0002        keeps group-write on directories created at runtime
#   stopwaitsecs      must exceed MEDIA_RENDER_TIMEOUT (default 7200)
#
# Placeholders to fill in before installing:
#   - the paths (replace /var/www/keje)
#   - the log path, which must exist and be writable by www-data
#
# Install:
#   sudo mkdir -p /var/log/keje && sudo chown www-data:www-data /var/log/keje
#   sudo cp deploy/supervisor/keje-worker.conf /etc/supervisor/conf.d/
#   sudo supervisorctl reread && sudo supervisorctl update
#   sudo supervisorctl start keje-worker:*
#
# Verify:
#   sudo supervisorctl status keje-worker:*
#   tail -f /var/log/keje/worker.log

[program:keje-worker]
process_name=%(program_name)s_%(process_num)02d

# --queue=media,default is not optional: renders are dispatched with
# onQueue('media') and a plain `queue:work` never sees them.
command=php /var/www/keje/apps/api/artisan queue:work --queue=media,default --timeout=7200 --tries=2 --sleep=3 --max-jobs=50

directory=/var/www/keje/apps/api
autostart=true
autorestart=true
user=www-data
umask=0002

# One worker. Renders are CPU-bound, so two in parallel make both slower.
numprocs=1

redirect_stderr=true
stdout_logfile=/var/log/keje/worker.log

# Above MEDIA_RENDER_TIMEOUT, so a restart never kills a render mid-encode.
stopwaitsecs=7300
