name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API — Laravel tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      # 8.2 is the floor declared in composer.json. Testing the floor rather
      # than the newest runtime is what makes that declaration meaningful.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-php8.2-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.2-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # No .env is written on purpose. phpunit.xml already pins the test
      # environment (sqlite in-memory, array cache/session), and APP_KEY is the
      # only thing missing from it. Supplying it as a throwaway env var keeps a
      # key out of the repository and avoids `artisan key:generate`, which
      # cannot run on a fresh checkout before the service providers have booted.
      - name: Run tests
        run: |
          export APP_KEY="base64:$(head -c 32 /dev/urandom | base64)"
          php artisan test

      # composer.json pins config.platform.php to 8.2, so the lockfile is
      # resolved for the declared floor rather than for whatever PHP the person
      # running `composer update` happens to have. Without it an update on a
      # newer machine silently pulls packages that cannot install on 8.2.
      - name: Verify lockfile resolves for PHP 8.2
        run: composer check-platform-reqs

      - name: Audit dependencies
        run: composer audit

  style:
    name: API — Pint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-php8.2-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.2-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check formatting
        run: ./vendor/bin/pint --test

  web:
    name: Web — types, build, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      # Node 22 matches the Vercel production runtime, so a green build here
      # means the deploy will compile too.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # npm workspaces keeps a single lockfile at the repo root; there has
          # never been one in apps/web, so pointing here failed the whole job
          # before lint, typecheck or build ever ran.
          cache-dependency-path: package-lock.json

      # Installed from the root so the whole workspace resolves. Binaries are
      # hoisted to the root node_modules and stay on PATH for the apps/web steps.
      - name: Install dependencies
        run: npm ci
        working-directory: .

      # next build type-checks too, but running tsc first gives the whole list
      # of type errors instead of only the one the build dies on.
      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Node's built-in runner over lib/**/*.test.ts. These existed but were
      # never executed here, so a broken redirect or CSP rule could land green.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_AUTH_MODE: bearer
          NEXT_PUBLIC_APP_NAME: Starter

      # Fails only on a new critical advisory. High advisories tied to a
      # semver-major upgrade are excluded so this job doesn't become a
      # permanently red signal everyone learns to ignore.
      - name: Audit dependencies
        run: npm audit --audit-level=critical
